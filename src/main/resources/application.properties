# Beanstalk nginx proxies to port 5000; local dev defaults to 8080
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.dynamodb.enabled=true

spring.application.name=water-meter-data-injection-service

aws.region=ap-south-1

# Same tables as water_meter_service (created by its CloudFormation stack)
watermeter.users-table=WaterMeterUsers
watermeter.table.tenants=WaterMeterTenants
watermeter.table.pre-enroll=WaterMeterDevicePreEnrollments
watermeter.table.units=WaterMeterUnits
watermeter.table.device-state=WaterMeterDeviceState
watermeter.table.today-slots=WaterMeterTodaySlots
watermeter.table.day-history=WaterMeterDayHistory
watermeter.table.device-config=WaterMeterDeviceConfig
