# Beanstalk nginx proxies to port 5000; local dev defaults to 8080
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.dynamodb.enabled=true

spring.application.name=water-meter-data-injection-service

aws.region=ap-south-1

# DynamoDB tables (shared with water_meter_service)
users.table.name=${USERS_TABLE_NAME:WaterMeterUsers}
tenants.table.name=${TENANTS_TABLE_NAME:WaterMeterTenants}
pre.enroll.table.name=${PRE_ENROLL_TABLE_NAME:WaterMeterDevicePreEnrollments}
units.table.name=${UNITS_TABLE_NAME:WaterMeterUnits}
device.state.table.name=${DEVICE_STATE_TABLE_NAME:WaterMeterDeviceState}
today.slots.table.name=${TODAY_SLOTS_TABLE_NAME:WaterMeterTodaySlots}
day.history.table.name=${DAY_HISTORY_TABLE_NAME:WaterMeterDayHistory}
device.config.table.name=${DEVICE_CONFIG_TABLE_NAME:WaterMeterDeviceConfig}
today.slots.ttl.hours=${TODAY_SLOTS_TTL_HOURS:72}
day.history.ttl.days=${DAY_HISTORY_TTL_DAYS:400}

# Aliases used by test-data API and health check
watermeter.users-table=WaterMeterUsers
watermeter.table.device-state=WaterMeterDeviceState

# MQTT ingestion (24x7 subscriber on this service)
device.mqtt.ingestion.enabled=${DEVICE_MQTT_INGESTION_ENABLED:true}
mock.telemetry.enabled=false

logging.level.root=WARN
logging.level.com.vswitch.datainjection=INFO
