# Beanstalk nginx proxies to port 5000; local dev defaults to 8080
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.dynamodb.enabled=true

spring.application.name=water-meter-data-injection-service

aws.region=ap-south-1

# DynamoDB tables (shared with water_meter_service)
users.table.name=${USERS_TABLE_NAME:WaterMeterUsers}
tenants.table.name=${TENANTS_TABLE_NAME:WaterMeterTenants}
pre.enroll.table.name=${PRE_ENROLL_TABLE_NAME:WaterMeterDevicePreEnrollments}
units.table.name=${UNITS_TABLE_NAME:WaterMeterUnits}
dummy.devices.table.name=${DUMMY_DEVICES_TABLE_NAME:WaterMeterDummyDevices}
dummy.telemetry.enabled=${DUMMY_TELEMETRY_ENABLED:true}
dummy.telemetry.min.ml=${DUMMY_TELEMETRY_MIN_ML:10}
dummy.telemetry.max.ml=${DUMMY_TELEMETRY_MAX_ML:80}
dummy.telemetry.registry.refresh.seconds=${DUMMY_TELEMETRY_REGISTRY_REFRESH_SECONDS:60}
dummy.telemetry.offline.enabled=${DUMMY_TELEMETRY_OFFLINE_ENABLED:true}
dummy.telemetry.offline.min-fraction=${DUMMY_TELEMETRY_OFFLINE_MIN_FRACTION:0.03}
dummy.telemetry.offline.max-fraction=${DUMMY_TELEMETRY_OFFLINE_MAX_FRACTION:0.06}
dummy.telemetry.offline.min-minutes=${DUMMY_TELEMETRY_OFFLINE_MIN_MINUTES:2}
dummy.telemetry.offline.max-minutes=${DUMMY_TELEMETRY_OFFLINE_MAX_MINUTES:5}
dummy.telemetry.offline.reconcile.seconds=${DUMMY_TELEMETRY_OFFLINE_RECONCILE_SECONDS:10}
dummy.telemetry.offline.cooldown.minutes=${DUMMY_TELEMETRY_OFFLINE_COOLDOWN_MINUTES:5}
dummy.history.backfill.enabled=${DUMMY_HISTORY_BACKFILL_ENABLED:true}
dummy.history.backfill.days=${DUMMY_HISTORY_BACKFILL_DAYS:30}
dummy.history.backfill.daily.min-liters=${DUMMY_HISTORY_BACKFILL_DAILY_MIN_LITERS:600}
dummy.history.backfill.daily.max-liters=${DUMMY_HISTORY_BACKFILL_DAILY_MAX_LITERS:1400}
dummy.history.backfill.threads=${DUMMY_HISTORY_BACKFILL_THREADS:4}
dummy.bulk.enroll.max=${DUMMY_BULK_ENROLL_MAX:1000}
dummy.bulk.enroll.threads=${DUMMY_BULK_ENROLL_THREADS:8}
device.state.table.name=${DEVICE_STATE_TABLE_NAME:WaterMeterDeviceState}
today.slots.table.name=${TODAY_SLOTS_TABLE_NAME:WaterMeterTodaySlots}
day.history.table.name=${DAY_HISTORY_TABLE_NAME:WaterMeterDayHistory}
device.config.table.name=${DEVICE_CONFIG_TABLE_NAME:WaterMeterDeviceConfig}
today.slots.ttl.hours=${TODAY_SLOTS_TTL_HOURS:72}
day.history.ttl.days=${DAY_HISTORY_TTL_DAYS:400}

# Aliases used by test-data API and health check
watermeter.users-table=WaterMeterUsers
watermeter.table.device-state=WaterMeterDeviceState

# MQTT ingestion (24x7 subscriber on this service)
device.mqtt.ingestion.enabled=${DEVICE_MQTT_INGESTION_ENABLED:true}
mock.telemetry.enabled=false

# Cognito JWT validation (REST + WebSocket subscribe)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_vm19Xv95r}
cognito.user.pool.id=${COGNITO_USER_POOL_ID:ap-south-1_vm19Xv95r}
cognito.user.deletion.enabled=${COGNITO_USER_DELETION_ENABLED:true}

# Tenant-scoped live WebSocket pushes
live.updates.enabled=${LIVE_UPDATES_ENABLED:true}

# Plain-TCP device stream for live 1s water pulses (newline-delimited JSON)
device.stream.enabled=${DEVICE_STREAM_ENABLED:true}
device.stream.port=${DEVICE_STREAM_PORT:9100}

logging.level.root=WARN
logging.level.com.vswitch.datainjection=INFO
